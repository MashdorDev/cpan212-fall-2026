<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
    <style>
      /* Three requests in a 15 second loop: no cookie (401), Sam (403), Ava (200). */
      .dot { opacity: 0; animation: 15s infinite; }
      .d1 { animation-name: d1; } .d2 { animation-name: d2; } .d3 { animation-name: d3; }
      @keyframes d1 {
        0% { opacity: 0; transform: translate(105px, 205px) } 2% { opacity: 1; transform: translate(105px, 205px) }
        10% { opacity: 1; transform: translate(355px, 205px) } 18%, 30% { opacity: 1; transform: translate(355px, 306px) }
        32%, 100% { opacity: 0; transform: translate(355px, 306px) }
      }
      @keyframes d2 {
        0%, 32% { opacity: 0; transform: translate(105px, 205px) } 34% { opacity: 1; transform: translate(105px, 205px) }
        42% { opacity: 1; transform: translate(355px, 205px) } 50% { opacity: 1; transform: translate(645px, 205px) }
        58%, 64% { opacity: 1; transform: translate(645px, 306px) } 66%, 100% { opacity: 0; transform: translate(645px, 306px) }
      }
      @keyframes d3 {
        0%, 66% { opacity: 0; transform: translate(105px, 205px) } 68% { opacity: 1; transform: translate(105px, 205px) }
        76% { opacity: 1; transform: translate(355px, 205px) } 84% { opacity: 1; transform: translate(645px, 205px) }
        88% { opacity: 1; transform: translate(800px, 205px) } 92%, 97% { opacity: 1; transform: translate(880px, 146px) } 100% { opacity: 0; transform: translate(880px, 146px) }
      }
      /* Each result box lights up while its request is there. */
      .hl { opacity: 0; animation: 15s infinite; }
      .h1 { animation-name: h1; } .h2 { animation-name: h2; } .h3 { animation-name: h3; }
      @keyframes h1 { 0%, 17% { opacity: 0 } 19%, 31% { opacity: 1 } 33%, 100% { opacity: 0 } }
      @keyframes h2 { 0%, 57% { opacity: 0 } 59%, 65% { opacity: 1 } 67%, 100% { opacity: 0 } }
      @keyframes h3 { 0%, 91% { opacity: 0 } 93%, 98% { opacity: 1 } 100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .dot, .hl { display: none; } }
    </style>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#222">PATCH /api/events/:id</text>
  <text x="480" y="64" text-anchor="middle" font-size="17" fill="#444">Two different questions, asked in order.</text>

  <rect x="30" y="170" width="150" height="70" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="2"/>
  <text x="105" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Request</text>
  <text x="105" y="222" text-anchor="middle" font-size="13" fill="#555">with or without a cookie</text>
  <line x1="180" y1="205" x2="242" y2="205" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <rect x="250" y="150" width="210" height="110" rx="8" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
  <text x="355" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4277">requireAuth</text>
  <text x="355" y="206" text-anchor="middle" font-size="14" fill="#1d4277">Who are you?</text>
  <text x="355" y="232" text-anchor="middle" font-size="13" fill="#1d4277">a session with a userId</text>
  <line x1="460" y1="205" x2="532" y2="205" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="496" y="195" text-anchor="middle" font-size="13" fill="#2f7d32">yes</text>

  <rect x="540" y="150" width="210" height="110" rx="8" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
  <text x="645" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4277">checkOrganizer</text>
  <text x="645" y="206" text-anchor="middle" font-size="14" fill="#1d4277">Is this yours?</text>
  <text x="645" y="232" text-anchor="middle" font-size="13" fill="#1d4277">event.organizer = your id</text>
  <line x1="750" y1="205" x2="812" y2="205" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="781" y="195" text-anchor="middle" font-size="13" fill="#2f7d32">yes</text>

  <rect x="820" y="170" width="120" height="70" rx="8" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
  <text x="880" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5c22">200</text>
  <text x="880" y="222" text-anchor="middle" font-size="13" fill="#1f5c22">changed</text>

  <line x1="355" y1="260" x2="355" y2="322" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="368" y="296" font-size="13" fill="#b3261e">no</text>
  <rect x="250" y="330" width="210" height="90" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/>
  <text x="355" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#8c1d18">401</text>
  <text x="355" y="384" text-anchor="middle" font-size="14" fill="#8c1d18">"Log in to do this"</text>
  <text x="355" y="406" text-anchor="middle" font-size="13" fill="#8c1d18">We don't know who you are</text>

  <line x1="645" y1="260" x2="645" y2="322" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="658" y="296" font-size="13" fill="#b3261e">no</text>
  <rect x="540" y="330" width="210" height="90" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/>
  <text x="645" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#8c1d18">403</text>
  <text x="645" y="384" text-anchor="middle" font-size="14" fill="#8c1d18">"Only the organizer..."</text>
  <text x="645" y="406" text-anchor="middle" font-size="13" fill="#8c1d18">We know you. It isn't yours.</text>
  <rect class="hl h1" x="246" y="326" width="218" height="98" rx="10" fill="none" stroke="#b3261e" stroke-width="5"/>
  <rect class="hl h2" x="536" y="326" width="218" height="98" rx="10" fill="none" stroke="#b3261e" stroke-width="5"/>
  <rect class="hl h3" x="816" y="166" width="128" height="78" rx="10" fill="none" stroke="#2f7d32" stroke-width="5"/>
  <g class="dot d1"><circle r="16" fill="#777777"/><text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">none</text></g>
  <g class="dot d2"><circle r="16" fill="#2b5fa8"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Sam</text></g>
  <g class="dot d3"><circle r="16" fill="#2f7d32"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Ava</text></g>
  <text x="480" y="455" text-anchor="middle" font-size="14" fill="#444">Grey: no cookie. Blue: Sam, changing Ava's event. Green: Ava, changing her own.</text>
</svg>
