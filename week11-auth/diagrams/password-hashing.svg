<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
    <style>
      /* One 14 second loop. Each part fades in on its own share of the loop, everything stays
         on screen for the last third, then the loop starts again. */
      .p { opacity: 0; animation: 14s infinite; }
      .r1a { animation-name: r1a; } .r1b { animation-name: r1b; } .r1c { animation-name: r1c; }
      .r2a { animation-name: r2a; } .r2b { animation-name: r2b; } .bt { animation-name: bt; }
      @keyframes r1a { 0% { opacity: 0 } 4% { opacity: 1 } 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r1b { 0%, 10% { opacity: 0 } 15% { opacity: 1 } 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r1c { 0%, 22% { opacity: 0 } 27% { opacity: 1 } 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r2a { 0%, 36% { opacity: 0 } 41% { opacity: 1 } 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r2b { 0%, 48% { opacity: 0 } 53% { opacity: 1 } 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes bt { 0%, 60% { opacity: 0 } 66% { opacity: 1 } 95% { opacity: 1 } 100% { opacity: 0 } }
      .gear { animation: spin 2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .p { animation: none; opacity: 1; } .gear { animation: none; } }
    </style>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Saving a password with bcrypt</text>
  <text x="480" y="64" text-anchor="middle" font-size="17" fill="#444">The database only ever gets the hash on the right.</text>

  <!-- row 1: Ava -->
  <g class="p r1a">
    <text x="30" y="115" font-size="14" font-weight="700" fill="#555">Ava registers</text>
    <rect x="30" y="125" width="190" height="56" rx="8" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
    <text x="125" y="159" text-anchor="middle" font-size="16" font-family="Consolas, monospace" fill="#1d4277">campus-demo-ava</text>
    <text x="240" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#444">+</text>
    <rect x="260" y="125" width="140" height="56" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
    <text x="330" y="149" text-anchor="middle" font-size="13" fill="#7a4800">random salt</text>
    <text x="330" y="169" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#7a4800">Q9xaLb...</text>
  </g>
  <g class="p r1b">
    <line x1="400" y1="153" x2="452" y2="153" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
    <rect x="460" y="118" width="170" height="70" rx="8" fill="#efe8fa" stroke="#6a3fb5" stroke-width="2"/>
    <g transform="translate(482 153)"><g class="gear"><circle r="13" fill="none" stroke="#6a3fb5" stroke-width="5" stroke-dasharray="6 4"/><circle r="5" fill="#6a3fb5"/></g></g>
    <text x="572" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#4b2a85">bcrypt</text>
    <text x="572" y="168" text-anchor="middle" font-size="12" fill="#4b2a85">slow on purpose</text>
    <line x1="630" y1="153" x2="672" y2="153" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <g class="p r1c">
    <rect x="680" y="125" width="260" height="56" rx="8" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
    <text x="810" y="159" text-anchor="middle" font-size="15" font-family="Consolas, monospace" fill="#1f5c22">$2b$12$Q9xaLb...kT2e</text>
    <text x="810" y="203" text-anchor="middle" font-size="13" fill="#555">cost and salt are stored inside the hash</text>
  </g>

  <!-- row 2: same password again -->
  <g class="p r2a">
    <text x="30" y="255" font-size="14" font-weight="700" fill="#555">Someone else picks the same password</text>
    <rect x="30" y="265" width="190" height="56" rx="8" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
    <text x="125" y="299" text-anchor="middle" font-size="16" font-family="Consolas, monospace" fill="#1d4277">campus-demo-ava</text>
    <text x="240" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#444">+</text>
    <rect x="260" y="265" width="140" height="56" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
    <text x="330" y="289" text-anchor="middle" font-size="13" fill="#7a4800">a different salt</text>
    <text x="330" y="309" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#7a4800">7mLpWq...</text>
    <line x1="400" y1="293" x2="452" y2="293" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
    <rect x="460" y="258" width="170" height="70" rx="8" fill="#efe8fa" stroke="#6a3fb5" stroke-width="2"/>
    <g transform="translate(482 293)"><g class="gear"><circle r="13" fill="none" stroke="#6a3fb5" stroke-width="5" stroke-dasharray="6 4"/><circle r="5" fill="#6a3fb5"/></g></g>
    <text x="560" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#4b2a85">bcrypt</text>
    <line x1="630" y1="293" x2="672" y2="293" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <g class="p r2b">
    <rect x="680" y="265" width="260" height="56" rx="8" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
    <text x="810" y="299" text-anchor="middle" font-size="15" font-family="Consolas, monospace" fill="#1f5c22">$2b$12$7mLpWq...Wc8r</text>
    <text x="810" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c22">Same password, different hash</text>
  </g>

  <!-- bottom: no way back -->
  <g class="p bt">
    <path d="M 700 365 C 600 420, 250 420, 140 340" fill="none" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
    <g stroke="#b3261e" stroke-width="5" stroke-linecap="round">
      <line x1="405" y1="390" x2="435" y2="420"/>
      <line x1="435" y1="390" x2="405" y2="420"/>
    </g>
    <text x="480" y="452" text-anchor="middle" font-size="15" fill="#8c1d18">There is no way back from a hash to the password.</text>
    <text x="480" y="472" text-anchor="middle" font-size="14" fill="#444">At login, bcrypt.compare() hashes what was typed with the stored salt and compares the two hashes.</text>
  </g>
</svg>
