<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Where tonight's 7 steps go</text>
  <text x="480" y="64" text-anchor="middle" font-size="17" fill="#444">Every request passes through these pieces, left to right. The purple numbers are the steps.</text>

  <!-- browser -->
  <rect x="20" y="130" width="120" height="90" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="2"/>
  <text x="80" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#333">Browser</text>
  <text x="80" y="188" text-anchor="middle" font-size="13" fill="#555">sends the</text>
  <text x="80" y="205" text-anchor="middle" font-size="13" fill="#555">campus.sid cookie</text>
  <line x1="140" y1="175" x2="172" y2="175" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- next -->
  <rect x="180" y="130" width="120" height="90" rx="8" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="2"/>
  <text x="240" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4277">Next.js</text>
  <text x="240" y="183" text-anchor="middle" font-size="13" fill="#1d4277">port 3000</text>
  <text x="240" y="202" text-anchor="middle" font-size="13" fill="#1d4277">forwards /api</text>
  <line x1="300" y1="175" x2="342" y2="175" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- express frame -->
  <rect x="350" y="100" width="420" height="330" rx="10" fill="#f6fbf6" stroke="#2f7d32" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="560" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5c22">Express API, port 4000</text>

  <rect x="370" y="140" width="120" height="70" rx="8" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
  <text x="430" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5c22">session</text>
  <text x="430" y="190" text-anchor="middle" font-size="13" fill="#1f5c22">req.session</text>
  <line x1="490" y1="175" x2="522" y2="175" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <rect x="530" y="140" width="120" height="70" rx="8" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
  <text x="590" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5c22">requireAuth</text>
  <text x="590" y="190" text-anchor="middle" font-size="13" fill="#1f5c22">req.user or 401</text>
  <line x1="590" y1="210" x2="590" y2="242" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <rect x="370" y="250" width="380" height="160" rx="8" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
  <text x="560" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5c22">controllers</text>
  <text x="395" y="310" font-size="14" fill="#1f5c22">register: hash, save, start a session</text>
  <text x="395" y="340" font-size="14" fill="#1f5c22">me, login, logout</text>
  <text x="395" y="370" font-size="14" fill="#1f5c22">events: organizer, checkOrganizer (403)</text>
  <text x="395" y="400" font-size="14" fill="#1f5c22">RSVPs: name and email from req.user</text>

  <line x1="770" y1="300" x2="812" y2="300" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- mongo -->
  <rect x="820" y="130" width="125" height="280" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
  <text x="882" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#7a4800">MongoDB</text>
  <rect x="835" y="180" width="95" height="50" rx="6" fill="#ffffff" stroke="#b26a00"/>
  <text x="882" y="210" text-anchor="middle" font-size="14" fill="#7a4800">users</text>
  <rect x="835" y="250" width="95" height="50" rx="6" fill="#ffffff" stroke="#b26a00"/>
  <text x="882" y="280" text-anchor="middle" font-size="14" fill="#7a4800">sessions</text>
  <rect x="835" y="320" width="95" height="50" rx="6" fill="#ffffff" stroke="#b26a00"/>
  <text x="882" y="350" text-anchor="middle" font-size="14" fill="#7a4800">events</text>

  <!-- step badges -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="490" cy="140" r="15" fill="#6a3fb5"/><text x="490" y="145">2</text>
    <circle cx="650" cy="140" r="15" fill="#6a3fb5"/><text x="650" y="145">4</text>
    <circle cx="370" cy="305" r="15" fill="#6a3fb5"/><text x="370" y="310">3</text>
    <circle cx="370" cy="335" r="15" fill="#6a3fb5"/><text x="370" y="340">5</text>
    <circle cx="370" cy="365" r="15" fill="#6a3fb5"/><text x="370" y="370">6</text>
    <circle cx="370" cy="395" r="15" fill="#6a3fb5"/><text x="370" y="400">7</text>
    <circle cx="930" cy="180" r="15" fill="#6a3fb5"/><text x="930" y="185">1</text>
    <circle cx="930" cy="250" r="15" fill="#6a3fb5"/><text x="930" y="255">2</text>
    <circle cx="930" cy="320" r="15" fill="#6a3fb5"/><text x="930" y="325">1</text>
  </g>
  <text x="590" y="236" font-size="12" fill="#555" text-anchor="start" dx="10">on routes from steps 6, 7</text>
</svg>
