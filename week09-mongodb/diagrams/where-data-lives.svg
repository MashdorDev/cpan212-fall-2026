<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Where the events live</text>

  <!-- Week 7 -->
  <text x="40" y="84" font-size="20" font-weight="700" fill="#222">Week 7</text>
  <rect x="40" y="100" width="220" height="70" rx="10" fill="#e3edf9" stroke="#1e5aa8" stroke-width="2"/>
  <text x="150" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#1e5aa8">Next.js</text>
  <text x="150" y="156" text-anchor="middle" font-size="15" fill="#1e5aa8">port 3000</text>
  <line x1="262" y1="135" x2="336" y2="135" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="340" y="92" width="380" height="86" rx="10" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
  <text x="400" y="128" font-size="20" font-weight="600" fill="#2f7d32">Express API</text>
  <rect x="540" y="106" width="160" height="58" rx="8" fill="#fff4d6" stroke="#b07a00" stroke-width="2"/>
  <text x="620" y="132" text-anchor="middle" font-size="16" font-weight="600" fill="#7a5400">const events = [</text>
  <text x="620" y="154" text-anchor="middle" font-size="15" fill="#7a5400">an array in memory</text>
  <text x="740" y="128" font-size="16" fill="#b3261e" font-weight="700">Restart the API:</text>
  <text x="740" y="152" font-size="16" fill="#b3261e">back to the 8 samples,</text>
  <text x="740" y="174" font-size="16" fill="#b3261e">new events are gone</text>

  <line x1="40" y1="222" x2="920" y2="222" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Week 9 -->
  <text x="40" y="270" font-size="20" font-weight="700" fill="#222">Week 9</text>
  <rect x="40" y="286" width="220" height="70" rx="10" fill="#e3edf9" stroke="#1e5aa8" stroke-width="2"/>
  <text x="150" y="318" text-anchor="middle" font-size="20" font-weight="600" fill="#1e5aa8">Next.js</text>
  <text x="150" y="342" text-anchor="middle" font-size="15" fill="#1e5aa8">port 3000, unchanged</text>
  <line x1="262" y1="321" x2="336" y2="321" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="340" y="278" width="380" height="86" rx="10" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
  <text x="400" y="314" font-size="20" font-weight="600" fill="#2f7d32">Express API</text>
  <rect x="540" y="292" width="160" height="58" rx="8" fill="#ffffff" stroke="#2f7d32" stroke-width="2"/>
  <text x="620" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#2f7d32">Event model</text>
  <text x="620" y="340" text-anchor="middle" font-size="15" fill="#2f7d32">Mongoose checks rules</text>
  <line x1="722" y1="321" x2="776" y2="321" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- database cylinder -->
  <path d="M780 296 a70 16 0 0 0 140 0 v58 a70 16 0 0 1 -140 0 z" fill="#f3e8fb" stroke="#6a3d9a" stroke-width="2"/>
  <ellipse cx="850" cy="296" rx="70" ry="16" fill="#f3e8fb" stroke="#6a3d9a" stroke-width="2"/>
  <text x="850" y="332" text-anchor="middle" font-size="17" font-weight="600" fill="#6a3d9a">MongoDB</text>
  <text x="850" y="354" text-anchor="middle" font-size="14" fill="#6a3d9a">Atlas or local</text>
  <text x="600" y="408" text-anchor="middle" font-size="16" fill="#2f7d32" font-weight="700">Restart the API: every event is still there</text>

  <!-- vocabulary -->
  <rect x="40" y="436" width="880" height="60" rx="10" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5"/>
  <text x="60" y="462" font-size="15" fill="#333"><tspan font-weight="700">database</tspan> campus_events   <tspan font-weight="700">collection</tspan> events (like a table)   <tspan font-weight="700">document</tspan> one event (like a row)</text>
  <text x="60" y="484" font-size="15" fill="#333">Every document gets an <tspan font-weight="700">_id</tspan> such as 6731f0c2a1b2c3d4e5f60718. The API sends it as <tspan font-weight="700">id</tspan>.</text>
</svg>
