  <text x="421.5" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5c22">4</text>
  <text x="421.5" y="205" text-anchor="middle" font-size="13" fill="#1f5c22">Resume review</text>
  <rect x="482" y="150" width="105" height="80" rx="8" fill="#e5f3e6" stroke="#2f7d32" stroke-width="2"/>
  <text x="534.5" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5c22">5</text>
