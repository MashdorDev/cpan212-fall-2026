  <path d="M30 138 V128 H361 V138" fill="none" stroke="#666666" stroke-width="2.5"/>
  <text x="195.5" y="118" text-anchor="middle" font-size="17" font-weight="600" fill="#666666">skip(3): jump over page 1</text>
  <path d="M369 138 V128 H700 V138" fill="none" stroke="#2f7d32" stroke-width="2.5"/>
  <text x="534.5" y="118" text-anchor="middle" font-size="17" font-weight="600" fill="#2f7d32">limit(3): send these</text>
