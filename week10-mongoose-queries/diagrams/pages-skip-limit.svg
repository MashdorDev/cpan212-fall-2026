  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#222">GET /api/events?page=2&amp;limit=3</text>
  <text x="480" y="66" text-anchor="middle" font-size="17" fill="#444">All 8 events, sorted by start time. MongoDB skips the first page and sends the next 3.</text>
