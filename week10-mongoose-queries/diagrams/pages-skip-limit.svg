  <text x="195.5" y="281" text-anchor="middle" font-size="17" font-weight="600" fill="#666666">page 1</text>
  <path d="M369 245 V255 H700 V245" fill="none" stroke="#2f7d32" stroke-width="2.5"/>
  <text x="534.5" y="281" text-anchor="middle" font-size="17" font-weight="600" fill="#2f7d32">page 2</text>
  <path d="M708 245 V255 H926 V245" fill="none" stroke="#888888" stroke-width="2.5"/>
  <text x="817.0" y="281" text-anchor="middle" font-size="17" font-weight="600" fill="#888888">page 3</text>
  <rect x="30" y="320" width="900" height="120" rx="10" fill="#fff4d6" stroke="#b07a00" stroke-width="2"/>
  <text x="60" y="356" font-family="Consolas, Menlo, monospace" font-size="18" fill="#7a5400">skip = (page - 1) * limit  =  (2 - 1) * 3  =  3</text>
  <text x="60" y="388" font-family="Consolas, Menlo, monospace" font-size="18" fill="#7a5400">Event.find(filter).sort(sortBy).skip(3).limit(3)</text>
  <text x="60" y="420" font-family="Consolas, Menlo, monospace" font-size="18" fill="#7a5400">totalPages = Math.ceil(total / limit)  =  Math.ceil(8 / 3)  =  3</text>
</svg>
