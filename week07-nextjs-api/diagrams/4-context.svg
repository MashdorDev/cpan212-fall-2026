<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Step 5: one saved list, shared through Context</text>

  <rect x="30" y="60" width="680" height="430" rx="14" fill="#f3eefb" stroke="#6a3fb5" stroke-width="2.5"/>
  <text x="50" y="92" font-size="20" font-weight="700" fill="#6a3fb5">SavedEventsProvider  (wraps every page in layout.js)</text>

  <rect x="190" y="112" width="360" height="104" rx="10" fill="#ffffff" stroke="#6a3fb5" stroke-width="2"/>
  <text x="370" y="144" text-anchor="middle" font-size="19" fill="#222" font-family="Consolas, monospace">savedIds = ['abc', 'xyz']</text>
  <text x="370" y="174" text-anchor="middle" font-size="19" fill="#222" font-family="Consolas, monospace">isSaved(id)</text>
  <text x="370" y="202" text-anchor="middle" font-size="19" fill="#222" font-family="Consolas, monospace">toggleSaved(id)</text>

  <rect x="55" y="350" width="190" height="110" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="150" y="398" text-anchor="middle" font-size="19" font-weight="600" fill="#222">SaveButton</text>
  <text x="150" y="426" text-anchor="middle" font-size="17" fill="#555">on /events</text>
  <rect x="275" y="350" width="190" height="110" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="370" y="398" text-anchor="middle" font-size="19" font-weight="600" fill="#222">SaveButton</text>
  <text x="370" y="426" text-anchor="middle" font-size="17" fill="#555">on /events/[id]</text>
  <rect x="495" y="350" width="190" height="110" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="590" y="398" text-anchor="middle" font-size="19" font-weight="600" fill="#222">/saved page</text>
  <text x="590" y="426" text-anchor="middle" font-size="17" fill="#555">shows saved ones</text>

  <g stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="150" y1="347" x2="290" y2="220"/>
    <line x1="370" y1="347" x2="370" y2="220"/>
    <line x1="590" y1="347" x2="450" y2="220"/>
  </g>
  <rect x="270" y="268" width="200" height="34" rx="6" fill="#f3eefb"/>
  <text x="370" y="292" text-anchor="middle" font-size="18" fill="#222" font-family="Consolas, monospace">useSavedEvents()</text>

  <rect x="760" y="112" width="170" height="104" rx="10" fill="#f1f1f1" stroke="#555" stroke-width="2"/>
  <text x="845" y="156" text-anchor="middle" font-size="19" font-weight="600" fill="#222">localStorage</text>
  <text x="845" y="184" text-anchor="middle" font-size="16" fill="#555">in this browser</text>
  <line x1="556" y1="164" x2="754" y2="164" stroke="#222" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="655" y="152" text-anchor="middle" font-size="16" fill="#555">kept in sync</text>

  <text x="845" y="300" text-anchor="middle" font-size="17" fill="#555">Week 6: each button</text>
  <text x="845" y="324" text-anchor="middle" font-size="17" fill="#555">had its own useState,</text>
  <text x="845" y="348" text-anchor="middle" font-size="17" fill="#555">so a page change</text>
  <text x="845" y="372" text-anchor="middle" font-size="17" fill="#555">forgot it.</text>
</svg>
